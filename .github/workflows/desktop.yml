name: Desktop
on:
  push:
    branches: [main]
    paths: &desktop_paths
      - 'src/**'
      - 'protocol/**'
      - 'config/**'
      - 'packaging/**'
      - 'tests/desktop/**'
      - 'tools/build_desktop.py'
      - 'tools/test_desktop_distribution.py'
      - 'pyproject.toml'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths: *desktop_paths
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Linux Qt dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0
      - name: Install development and desktop dependencies
        run: python -m pip install -e ".[dev,google,desktop]" "pyinstaller>=6.11,<7"
      - name: Desktop tests with real GUI and core imports
        run: python -m pytest tests/desktop -ra
      - name: Complete Linux regression suite
        if: runner.os == 'Linux'
        run: python -m pytest
      - name: Build WATCHDOG
        run: python tools/build_desktop.py --role watchdog
      - name: Build FETCHER
        run: python tools/build_desktop.py --role fetcher
      - name: Packaged application and installer acceptance
        run: python tools/test_desktop_distribution.py
      - name: Publish installers and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tb4-desktop-${{ runner.os }}-${{ github.sha }}
          path: |
            desktop-dist/installers/*
            desktop-dist/acceptance.json
          if-no-files-found: error
