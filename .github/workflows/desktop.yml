name: Desktop
on:
  push:
    branches: [main]
    paths: &desktop_paths
      - 'src/**'
      - 'protocol/**'
      - 'config/**'
      - 'packaging/**'
      - 'tests/desktop/**'
      - 'tools/build_desktop.py'
      - 'tools/test_desktop_distribution.py'
      - 'pyproject.toml'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths: *desktop_paths
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Linux Qt dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0 iproute2
      - name: Install development and desktop dependencies
        run: python -m pip install -e ".[dev,google,desktop]" "pyinstaller>=6.11,<7"
      - name: Desktop tests with real GUI and core imports
        run: python -m pytest tests/desktop -ra
      - name: Native Windows credential boundary qualification
        if: runner.os == 'Windows'
        run: python -m pytest tests/security/test_windows_key_native.py -ra -s
      - name: Native Linux credential boundary qualification
        if: runner.os == 'Linux'
        run: python -m pytest tests/security/test_linux_key_native.py -ra
      - name: Native protected first-run qualification
        run: python -m pytest tests/security/test_private_settings_native.py tests/security/test_first_run_native.py tests/security/test_credential_persistence_native.py tests/security/test_setup_credentials_native.py -ra
      - name: Native scoped discovery qualification
        env:
          TB4_REQUIRE_NATIVE_DISCOVERY: '1'
        run: python -m pytest tests/discovery/test_native_loopback.py -ra
      - name: Private BALLPARK and local owner review qualification
        run: python -m pytest tests/drive/test_ballpark_setup.py tests/drive/test_ballpark_publication.py -ra
      - name: Distinct FETCHER enrollment and actual profile qualification
        run: python -m pytest tests/drive/test_fetcher_profile.py tests/drive/test_fetcher_enrollment.py -ra
      - name: Complete platform regression suite
        run: python -m pytest
      - name: Build WATCHDOG
        run: python tools/build_desktop.py --role watchdog
      - name: Build FETCHER
        run: python tools/build_desktop.py --role fetcher
      - name: Packaged application and installer acceptance
        run: python tools/test_desktop_distribution.py
      - name: Publish installers and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tb4-desktop-${{ runner.os }}-${{ github.sha }}
          path: |
            desktop-dist/installers/*
            desktop-dist/acceptance.json
          if-no-files-found: error
