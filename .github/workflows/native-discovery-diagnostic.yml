name: Native discovery diagnostic
on:
  push:
    branches: [feat/rp027-staged-reconfiguration]
    paths:
      - 'docs/implementation-plan/revisions/R2/evidence/RP-027/A001/native-discovery-diagnostic-request.json'
permissions:
  contents: read
jobs:
  isolated-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      TB4_REQUIRE_NATIVE_DISCOVERY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install diagnostic dependencies
        run: python -m pip install -e ".[dev]"
      - name: Closed metadata of bounded loopback queries
        run: python tools/diagnose_native_discovery.py

