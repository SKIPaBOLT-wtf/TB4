name: CI

on:
  push:
    branches: ["main"]
    paths-ignore: &progress_only
      - 'docs/**'
      - 'AGENTS.md'
  pull_request:
    paths-ignore: *progress_only

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Public repository security scan
        run: python tools/scan_public_repo.py

      - name: Test
        run: python -m pytest
