name: CI

on:
  push:
    branches: ["main"]
    paths-ignore: &progress_only
      - 'docs/**'
      - 'AGENTS.md'
  pull_request:
    paths-ignore: *progress_only

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Public repository security scan
        run: python tools/scan_public_repo.py

      - name: Isolated folder helper prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo mkdir -p /run/sshd

      - name: Native Linux credential boundary qualification
        run: python -m pytest tests/security/test_linux_key_native.py -ra

      - name: Native protected first-run qualification
        run: python -m pytest tests/security/test_private_settings_native.py tests/security/test_first_run_native.py tests/security/test_credential_persistence_native.py tests/security/test_setup_credentials_native.py -ra

      - name: Test
        env:
          TB4_REQUIRE_FOLDER_SSH: '1'
        run: python -m pytest
