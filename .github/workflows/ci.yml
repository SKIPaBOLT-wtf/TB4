name: CI

on:
  push:
    branches: ["main"]
    paths-ignore: &progress_only
      - 'docs/**'
      - 'AGENTS.md'
  pull_request:
    paths-ignore: *progress_only

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Public repository security scan
        run: python tools/scan_public_repo.py

      - name: Test
        run: python -m pytest
