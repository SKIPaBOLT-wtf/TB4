name: Folder reconfiguration

on:
  push:
    branches: [main, feat/rp027-staged-reconfiguration]
    paths: &folder_paths
      - 'src/tb4/drive/folder_*.py'
      - 'src/tb4/drive/commissioning_folder.py'
      - 'src/tb4/reconfiguration_*.py'
      - 'protocol/folder-path-mapping-v1.schema.json'
      - 'tests/drive/folder_mapping_support.py'
      - 'tests/drive/folder_relocation_support.py'
      - 'tests/drive/test_folder_*.py'
      - '.github/workflows/folder-reconfiguration.yml'
      - 'docs/implementation-plan/revisions/R2/evidence/RP-027/A001/folder-linux-request.json'
  pull_request:
    paths: *folder_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-folder:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      TB4_REQUIRE_FOLDER_SSH: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Public repository security scan
        run: python tools/scan_public_repo.py
      - name: Isolated fixed-helper prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo mkdir -p /run/sshd
      - name: Required read-only physical Folder probe and isolated SSH cases
        run: >-
          python -m pytest tests/drive/test_folder_endpoint.py tests/security/test_folder_endpoint_native.py
          tests/security/test_folder_endpoint_selection.py
          tests/security/test_folder_endpoint_attachment_native.py
          tests/security/test_folder_connection_native.py tests/drive/test_folder_connection_authenticated_ssh.py
          tests/security/test_folder_prerequisites_native.py
          tests/drive/test_folder_candidate_authenticated_ssh.py
          tests/security/test_folder_runtime_native.py tests/drive/test_folder_runtime_authenticated_ssh.py
          tests/drive/test_folder_staged_endpoint_authenticated_ssh.py
          tests/security/test_folder_runtime_factory_native.py tests/drive/test_folder_retained_authenticated_ssh.py
          tests/drive/test_folder_mapping_after_probe.py tests/drive/test_folder_mapping_after_probe_native.py
          tests/drive/test_native_folder_active_adoption_authenticated_ssh.py
          tests/drive/test_folder_helper_dispatch.py tests/drive/test_folder_combined_authenticated_ssh.py
          tests/drive/test_folder_probe.py tests/drive/test_folder_probe_native.py
          tests/drive/test_folder_ssh.py tests/drive/test_folder_first_run.py
          tests/drive/test_folder_first_run_native.py tests/security/test_remote_folder_first_run_native.py
          tests/security/test_folder_credential_purpose.py tests/security/test_folder_credential_purpose_native.py
          tests/security/test_folder_authority_purpose.py tests/security/test_folder_authority_purpose_native.py
          tests/drive/test_folder_authority_transport.py tests/security/test_folder_authority_transport_native.py
          tests/drive/test_folder_authority_authenticated_ssh.py
          tests/drive/test_folder_probe_transport.py tests/security/test_folder_probe_transport_native.py
          tests/drive/test_folder_probe_authenticated_ssh.py
          -ra --junitxml=folder-probe-results.xml
      - name: Required actual Linux mapping and relocation cases
        run: python -m pytest tests/drive/test_folder_mapping.py tests/drive/test_folder_relocation.py -ra --junitxml=folder-mapping-results.xml
      - name: Required actual Linux retained Folder publication cases
        run: python -m pytest tests/drive/test_folder_retained.py -ra --junitxml=folder-retained-results.xml
      - name: Required actual Linux current-role Folder ACTIVE adoption cases
        run: python -m pytest tests/drive/test_folder_active_adoption.py -ra --junitxml=folder-active-adoption-results.xml
      - name: Original folder and native maintenance regressions
        run: >-
          python -m pytest
          tests/drive/test_folder_commissioning.py
          tests/drive/test_folder_store.py
          tests/drive/test_folder_protocol.py
          tests/drive/test_folder_lock_order.py
          tests/security/test_private_settings_native.py
          tests/security/test_reconfiguration_maintenance_native.py
          tests/security/test_reconfiguration_evidence_native.py
          tests/security/test_reconfiguration_effects_native.py
          -ra --junitxml=folder-regression-results.xml
      - name: Original Docs and effect regressions
        run: >-
          python -m pytest
          tests/drive/test_reconfiguration_effects.py
          tests/drive/test_reconfiguration_roots.py
          tests/drive/test_reconfiguration_root_plan.py
          tests/drive/test_reconfiguration_root_resume.py
          tests/drive/test_reconfiguration_root_settlement.py
          tests/drive/test_reconfiguration_root_no_dispatch.py
          tests/drive/test_reconfiguration_rebind.py
          tests/drive/test_reconfiguration_post_root.py
          tests/drive/test_reconfiguration_commit.py
          tests/drive/test_reconfiguration_promotion.py
          tests/drive/test_reconfiguration_admission.py
          tests/drive/test_reconfiguration_active_adoption.py
          tests/drive/test_reconfiguration_retained.py
          tests/security/test_reconfiguration_roots_native.py
          tests/security/test_reconfiguration_root_plan_native.py
          tests/security/test_reconfiguration_root_resume_native.py
          tests/security/test_reconfiguration_root_settlement_native.py
          tests/security/test_reconfiguration_root_no_dispatch_native.py
          tests/security/test_reconfiguration_rebind_native.py
          tests/security/test_reconfiguration_post_root_native.py
          tests/security/test_reconfiguration_commit_native.py
          tests/security/test_reconfiguration_promotion_native.py
          tests/security/test_reconfiguration_admission_native.py
          tests/security/test_reconfiguration_active_adoption_native.py
          tests/security/test_reconfiguration_retained_native.py
          -k 'not actual_max_capacity129_fixed_objects'
          -ra --junitxml=folder-docs-regression-results.xml
      - name: Preserve source-linked case results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: folder-reconfiguration-${{ github.sha }}
          path: folder-*-results.xml
          if-no-files-found: warn
