name: Progress
on:
  push:
    branches: [main, 'work/rp-*']
    paths:
      - 'docs/**'
      - 'AGENTS.md'
      - 'tools/development/**'
      - 'tests/development/**'
      - '.github/workflows/progress.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'AGENTS.md'
      - 'tools/development/**'
      - 'tests/development/**'
      - '.github/workflows/progress.yml'
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/development -ra
      - run: python -m tools.development.ledger
      - name: Preserve published history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            python -m tools.development.ledger --base "$BASE_SHA"
          fi
      - run: python tools/scan_public_repo.py
