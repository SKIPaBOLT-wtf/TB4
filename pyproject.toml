[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tb4"
version = "0.0.1"
description = "Deterministic Drive-native terminal bridge control system"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "SKIPaBOLT-wtf"}]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
google = [
  "google-api-python-client>=2.0",
  "google-auth>=2.0",
  "google-auth-httplib2>=0.2",
  "google-auth-oauthlib>=1.0",
]
windows = [
  "pywin32>=311; sys_platform == 'win32'",
]
desktop = [
  "PySide6>=6.8,<7",
  "tomlkit>=0.13,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[project.scripts]
tb4 = "tb4.cli:main"

[project.gui-scripts]
tb4-watchdog = "tb4.desktop.entry:watchdog_main"
tb4-fetcher = "tb4.desktop.entry:fetcher_main"
